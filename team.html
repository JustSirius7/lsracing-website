<!DOCTYPE html>
<html lang="it">
<head>

    <!-- Navbar -->

    <main>

        <section class="team-hero">

                        <span class="number">04</span>

                        <div class="divider"></div>

                        <span class="status">
                            <span class="dot"></span>

                        </span>

                    </div>

                </div>

            </div>

        </section>

        <!-- Team -->
        <section class="team-section">

            <div id="proprieta"></div>

            <div id="officina"></div>

    <!-- Footer -->
