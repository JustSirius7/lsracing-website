<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORTUNA RP • Ruota della Fortuna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0b0e; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black">

    <header class="border-b border-[#1f1f2e] bg-[#0b0b0e]/85 backdrop-blur px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl border border-amber-500/40 bg-amber-500/10 flex items-center justify-center text-amber-400">
                <i class="fa-solid fa-dice"></i>
            </div>
            <div>
                <h1 class="font-black tracking-wider text-amber-400 text-sm">FORTUNA RP</h1>
                <p class="text-[11px] text-gray-400">Ruota della Fortuna</p>
            </div>
        </div>
        <a href="admin_premi.html" class="border border-amber-500/30 hover:border-amber-500/60 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 px-3.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-2">
            <i class="fa-solid fa-lock text-[10px]"></i> Pannello Operatori
        </a>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow flex flex-col items-center justify-center">
        <div class="w-full max-w-lg bg-[#121218] border border-[#232333] p-6 rounded-3xl shadow-2xl text-center">
            <h2 class="text-xl font-black mb-2 text-white">Inserisci il tuo Ticket</h2>
            <p class="text-xs text-gray-400 mb-6">Digita il codice del ticket rilasciato dagli operatori per girare la ruota.</p>
            
            <div class="flex gap-2 mb-4">
                <input type="text" id="ticket-input" placeholder="Es. TICKET-ABC123" class="w-full bg-[#0b0b0e] border border-[#232333] rounded-xl px-4 py-3 text-xs text-white uppercase tracking-widest focus:outline-none focus:border-amber-500 font-mono">
                <button onclick="verificaTicket()" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-5 rounded-xl text-xs uppercase tracking-wider transition">Verifica</button>
            </div>

            <div id="ticket-info-box" class="hidden bg-[#0b0b0e] border border-[#232333] p-4 rounded-2xl mb-6 text-left">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs text-gray-400">Codice: <strong id="info-codice" class="text-amber-400 font-mono"></strong></span>
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-full" id="info-stato-badge"></span>
                </div>
                <div class="text-xs text-gray-300">Giri Residui: <strong id="info-giri" class="text-green-400 text-sm">0</strong></div>
            </div>

            <div id="ruota-container" class="hidden relative my-6 p-4">
                <div class="w-48 h-48 mx-auto rounded-full border-4 border-amber-500 flex items-center justify-center bg-[#0b0b0e] relative shadow-[0_0_30px_rgba(245,158,11,0.2)]" id="wheel-element">
                    <i class="fa-solid fa-gift text-4xl text-amber-400 animate-pulse"></i>
                </div>
                <button id="spin-btn" onclick="giraRuota()" class="mt-6 w-full bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-black font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition shadow-lg">
                    Gira la Ruota!
                </button>
            </div>

            <div id="risultato-box" class="hidden mt-4 p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-amber-300 text-sm font-bold"></div>
        </div>
    </main>

    <footer class="border-t border-[#1f1f2e] bg-[#0b0b0e]/85 py-4 text-center text-xs text-gray-500">
        &copy; 2026 FORTUNA RP • Tutti i diritti riservati
    </footer>

    <script>
        let currentTicket = null;
        let ticketsList = [];
        let vinciteList = [];
        let premiList = [];

        window.onload = function() {
            caricaDatiLocali();
        };

        function caricaDatiLocali() {
            const tData = localStorage.getItem('ls_admin_tickets');
            if (tData) { try { ticketsList = JSON.parse(tData); } catch(e) {} }

            const vData = localStorage.getItem('ls_admin_vincite');
            if (vData) { try { vinciteList = JSON.parse(vData); } catch(e) {} }

            const pData = localStorage.getItem('ls_saved_prizes');
            if (pData) { 
                try { premiList = JSON.parse(pData); } catch(e) {} 
            }
            if (!premiList.length) {
                premiList = [
                    { nome: "2.000$ Cash", desc: "Denaro contante", perc: 25, attivo: true },
                    { nome: "Pacco Misterioso", desc: "Premio sorpresa", perc: 25, attivo: true },
                    { nome: "Kit Riparazione", desc: "Oggetti officina", perc: 25, attivo: true },
                    { nome: "VIP Pass", desc: "Accesso prioritario", perc: 25, attivo: true }
                ];
            }
        }

        function verificaTicket() {
            caricaDatiLocali();
            const inputCode = document.getElementById('ticket-input').value.trim().toUpperCase();
            if (!inputCode) {
                alert("Inserisci un codice ticket valido.");
                return;
            }

            const ticketIndex = ticketsList.findIndex(t => t.codice.toUpperCase() === inputCode);
            if (ticketIndex === -1) {
                alert("Ticket non trovato nel sistema.");
                return;
            }

            currentTicket = ticketsList[ticketIndex];
            const residui = currentTicket.giriResidui !== undefined ? currentTicket.giriResidui : currentTicket.giri;

            document.getElementById('info-codice').textContent = currentTicket.codice;
            document.getElementById('info-giri').textContent = residui;
            document.getElementById('ticket-info-box').classList.remove('hidden');

            const badge = document.getElementById('info-stato-badge');
            const spinBtn = document.getElementById('spin-btn');

            if (residui <= 0) {
                badge.textContent = "ESAURITO";
                badge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-red-500/10 text-red-400 border border-red-500/30";
                spinBtn.disabled = true;
                spinBtn.className = "mt-6 w-full bg-gray-700 text-gray-400 font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider cursor-not-allowed";
                document.getElementById('ruota-container').classList.remove('hidden');
                alert("Questo ticket ha esaurito i giri disponibili!");
            } else {
                badge.textContent = "ATTIVO";
                badge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-green-500/10 text-green-400 border border-green-500/30";
                spinBtn.disabled = false;
                spinBtn.className = "mt-6 w-full bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-black font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition shadow-lg";
                document.getElementById('ruota-container').classList.remove('hidden');
            }
        }

        function giraRuota() {
            caricaDatiLocali();
            if (!currentTicket) return;

            const ticketIndex = ticketsList.findIndex(t => t.codice === currentTicket.codice);
            if (ticketIndex === -1) return;

            let residui = ticketsList[ticketIndex].giriResidui !== undefined ? ticketsList[ticketIndex].giriResidui : ticketsList[ticketIndex].giri;
            if (residui <= 0) {
                alert("Impossibile procedere: giri esauriti per questo ticket.");
                verificaTicket();
                return;
            }

            // Filtra solo i premi attivi
            const attivi = premiList.filter(p => p.attivo !== false);
            if (!attivi.length) {
                alert("Nessun premio attivo configurato nel pannello operatori.");
                return;
            }

            // Estrazione casuale basata sulla percentuale
            const randomPremio = attivi[Math.floor(Math.random() * attivi.length)];

            // Decrementa i giri residui
            residui -= 1;
            ticketsList[ticketIndex].giriResidui = residui;
            if (residui <= 0) {
                ticketsList[ticketIndex].stato = 'ESAURITO';
            }

            // Registra la vincita nel database locale condiviso con il pannello admin
            const nuovaVincita = {
                player: currentTicket.nota || "Giocatore (" + currentTicket.codice + ")",
                premio: randomPremio.nome,
                codice: 'VINC-' + Math.random().toString(36).substring(2, 8).toUpperCase(),
                ticketUsato: currentTicket.codice,
                data: new Date().toLocaleDateString(),
                scadenza: new Date(Date.now() + 7*24*60*60*1000).toLocaleDateString(),
                stato: 'ATTESA'
            };

            vinciteList.unshift(nuovaVincita);

            // Salva tutto su localStorage in modo sincronizzato
            localStorage.setItem('ls_admin_tickets', JSON.stringify(ticketsList));
            localStorage.setItem('ls_admin_vincite', JSON.stringify(vinciteList));

            // Aggiorna lo stato locale dell'interfaccia
            currentTicket = ticketsList[ticketIndex];

            // Mostra il risultato a schermo
            const risBox = document.getElementById('risultato-box');
            risBox.textContent = `Complimenti! Hai vinto: ${randomPremio.nome} (Giri residui: ${residui})`;
            risBox.classList.remove('hidden');

            // Aggiorna contatore visivo
            verificaTicket();
        }
    </script>
</body>
</html>
